<main class="app-shell">
  <section class="card">
    <header class="card-header">
      <h1>{{ title() }}</h1>
      <p>Coloca cada fila del ADN en una línea. Usa solo A, T, C y G.</p>
    </header>

    <label>Secuencia ADN</label>
    <div class="dna-grid">
      <div *ngFor="let row of dnaGrid(); let r = index; trackBy: trackByIndex" class="dna-row">
        <input
          *ngFor="let cell of row; let c = index; trackBy: trackByIndex"
          id="dna-cell-{{ r }}-{{ c }}"
          class="dna-cell"
          [ngClass]="getCellClass(r, c)"
          type="text"
          inputmode="text"
          maxlength="1"
          [value]="cell"
          (focus)="selectCell($event)"
          (input)="onCellInput(r, c, $event)"
          aria-label="Celda ADN fila {{ r + 1 }} columna {{ c + 1 }}"
        />
      </div>
    </div>

    <div class="actions">
      <button type="button" (click)="checkMutant()">Validar ADN</button>
    </div>

    <div class="message error" *ngIf="error()">{{ error() }}</div>
    <div class="message success" *ngIf="result() && !error()">{{ result() }}</div>

    <div class="example">
      <strong>Ejemplo mutante:</strong>
      <pre>ATGCGA
CAGTGC
TTATGT
AGAAGG
CCCCTA
TCACTG</pre>
    </div>
  </section>
</main>
